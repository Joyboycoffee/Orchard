version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: orchard-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://orchard_user:orchard_secure_pass_2026@postgres:5432/orchard_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=orchard_super_secret_jwt_key_change_in_production_32chars_min
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: orchard-postgres
    restart: always
    environment:
      POSTGRES_USER: orchard_user
      POSTGRES_PASSWORD: orchard_secure_pass_2026
      POSTGRES_DB: orchard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: orchard-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
