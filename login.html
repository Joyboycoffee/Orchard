<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Login & Register — Orchard E-Commerce</title>
  <link rel="icon" type="image/png" href="images/logo_transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
  :root {
    --primary-dark: #0c3b2e;
    --primary: #10b981;
    --primary-light: #6ee7b7;
    --primary-bg: #ecfdf5;
    --accent-gold: #d4af37;
    --bg-dark: #071e17;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --radius-md: 14px;
    --radius-lg: 24px;
    --shadow-glow: 0 0 35px rgba(16, 185, 129, 0.4);
    --font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: var(--font-family);
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #0f4c3a 0%, #061913 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    color: #ffffff;
    padding: 1.5rem;
    position: relative;
  }

  /* Ambient Background Particles */
  .bg-glow-1 {
    position: absolute;
    top: 10%;
    left: 15%;
    width: 350px;
    height: 350px;
    background: rgba(16, 185, 129, 0.2);
    filter: blur(100px);
    border-radius: 50%;
    pointer-events: none;
  }

  .bg-glow-2 {
    position: absolute;
    bottom: 10%;
    right: 15%;
    width: 400px;
    height: 400px;
    background: rgba(212, 175, 55, 0.15);
    filter: blur(120px);
    border-radius: 50%;
    pointer-events: none;
  }

  /* Back Button */
  .back-btn {
    position: absolute;
    top: 2rem;
    left: 2rem;
    color: var(--primary-light);
    text-decoration: none;
    font-weight: 700;
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(255, 255, 255, 0.08);
    padding: 0.6rem 1.2rem;
    border-radius: 99px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    transition: all 0.3s ease;
    z-index: 50;
  }

  .back-btn:hover {
    background: rgba(16, 185, 129, 0.25);
    color: #ffffff;
    transform: translateX(-3px);
  }

  /* Apple Slice Theater Wrapper */
  .theater-container {
    width: 100%;
    max-width: 460px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Apple Icon Stage */
  .apple-stage {
    width: 160px;
    height: 160px;
    position: relative;
    cursor: pointer;
    margin-bottom: -40px;
    z-index: 20;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .apple-stage:hover {
    transform: scale(1.08);
  }

  /* Left Half of Apple */
  .apple-half-left {
    position: absolute;
    top: 0;
    left: 0;
    width: 80px;
    height: 160px;
    overflow: hidden;
    transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
  }

  /* Right Half of Apple */
  .apple-half-right {
    position: absolute;
    top: 0;
    right: 0;
    width: 80px;
    height: 160px;
    overflow: hidden;
    transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
  }

  .apple-svg {
    width: 160px;
    height: 160px;
  }

  /* Slice Cut Flash Effect */
  .slice-flash {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0px;
    height: 4px;
    background: #ffffff;
    box-shadow: 0 0 25px 8px #d4af37, 0 0 50px 15px #10b981;
    transform: translate(-50%, -50%) rotate(-45deg);
    opacity: 0;
    pointer-events: none;
    z-index: 30;
    transition: all 0.4s ease-out;
  }

  /* Sliced Active Animation State */
  .sliced .apple-half-left {
    transform: translateX(-70px) rotate(-15deg);
  }

  .sliced .apple-half-right {
    transform: translateX(70px) rotate(15deg);
  }

  .sliced .slice-flash {
    width: 260px;
    opacity: 1;
    animation: flashOut 0.6s forwards;
  }

  @keyframes flashOut {
    0% { opacity: 1; width: 0; }
    50% { opacity: 1; width: 280px; }
    100% { opacity: 0; width: 320px; }
  }

  /* Glassmorphic Form Card */
  .auth-card {
    width: 100%;
    background: rgba(255, 255, 255, 0.95);
    color: var(--text-main);
    border-radius: var(--radius-lg);
    padding: 2.5rem 2rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), var(--shadow-glow);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    opacity: 0;
    transform: translateY(40px) scale(0.92);
    transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 10;
  }

  .sliced ~ .auth-card,
  .auth-card.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* Tab Navigation */
  .auth-tabs {
    display: flex;
    background: #f1f5f9;
    padding: 4px;
    border-radius: 99px;
    margin-bottom: 2rem;
  }

  .auth-tab {
    flex: 1;
    padding: 0.75rem;
    text-align: center;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--text-muted);
    border: none;
    background: transparent;
    border-radius: 99px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .auth-tab.active {
    background: var(--primary-dark);
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(12, 59, 46, 0.2);
  }

  /* Form Elements */
  .form-group {
    margin-bottom: 1.25rem;
    text-align: left;
  }

  .form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 0.4rem;
  }

  .input-wrapper {
    position: relative;
  }

  .form-input {
    width: 100%;
    padding: 0.85rem 1rem;
    padding-left: 2.75rem;
    border: 1.5px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 0.95rem;
    background: #f8fafc;
    transition: all 0.3s ease;
  }

  .form-input:focus {
    border-color: var(--primary);
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
  }

  .input-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.1rem;
    opacity: 0.6;
  }

  .submit-btn {
    width: 100%;
    padding: 0.95rem;
    background: linear-gradient(135deg, var(--primary-dark) 0%, #10b981 100%);
    color: #ffffff;
    font-weight: 800;
    font-size: 1rem;
    border: none;
    border-radius: 99px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
    margin-top: 0.5rem;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(16, 185, 129, 0.4);
  }

  /* Quick Demo Login Pill */
  .demo-pill {
    margin-top: 1.5rem;
    background: var(--primary-bg);
    border: 1px solid var(--primary-light);
    border-radius: var(--radius-md);
    padding: 0.75rem 1rem;
    font-size: 0.82rem;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .demo-btn {
    background: var(--primary);
    color: #ffffff;
    padding: 0.3rem 0.7rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    border: none;
    cursor: pointer;
  }

  .toast-msg {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--primary-dark);
    color: #ffffff;
    padding: 0.8rem 1.6rem;
    border-radius: 99px;
    font-weight: 700;
    font-size: 0.9rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 100;
  }

  .toast-msg.show {
    transform: translateX(-50%) translateY(0);
  }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Back to Store Link -->
  <a href="index.html" class="back-btn">
    ← Return to Orchard Store
  </a>

  <div class="theater-container">
    
    <!-- Animated Apple Slicer Stage -->
    <div class="apple-stage" id="apple-stage" title="Click to Slice Open Orchard Portal">
      <div class="slice-flash"></div>
      
      <!-- Left Sliced Half -->
      <div class="apple-half-left">
        <svg class="apple-svg" viewBox="0 0 160 160">
          <circle cx="80" cy="90" r="55" fill="#EF4444" />
          <circle cx="60" cy="80" r="40" fill="#F87171" />
          <path d="M80 35 Q 85 15 95 10" stroke="#78350F" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M80 30 Q 55 10 50 25 Q 65 35 80 30" fill="#10B981"/>
        </svg>
      </div>

      <!-- Right Sliced Half -->
      <div class="apple-half-right">
        <svg class="apple-svg" style="margin-left: -80px;" viewBox="0 0 160 160">
          <circle cx="80" cy="90" r="55" fill="#EF4444" />
          <circle cx="100" cy="80" r="40" fill="#F87171" />
          <path d="M80 35 Q 85 15 95 10" stroke="#78350F" stroke-width="6" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Interactive Auth Form Card -->
    <div class="auth-card" id="auth-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 style="font-weight: 800; font-size: 1.6rem; color: var(--primary-dark);">Welcome to Orchard</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">High-density nursery & fresh produce portal</p>
      </div>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Create Account</button>
      </div>

      <!-- SIGN IN FORM -->
      <form id="form-login" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label">Email or Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="login-user" class="form-input" placeholder="admin or user@orchard.com" required value="admin">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="login-pass" class="form-input" placeholder="••••••••" required value="admin123">
          </div>
        </div>

        <button type="submit" class="submit-btn">
          <span>Sign In to Orchard →</span>
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form id="form-register" style="display: none;" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">🌱</span>
            <input type="text" id="reg-name" class="form-input" placeholder="e.g. Ramesh Kumar" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="reg-email" class="form-input" placeholder="ramesh@gmail.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Create Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔑</span>
            <input type="password" id="reg-pass" class="form-input" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="submit-btn">
          <span>Register Account →</span>
        </button>
      </form>

      <!-- Demo Shortcut Pill -->
      <div class="demo-pill">
        <div>
          <strong>Demo Admin Account:</strong><br>
          <span style="opacity: 0.8;">admin / admin123</span>
        </div>
        <button class="demo-btn" onclick="fillDemoAdmin()">Auto Fill</button>
      </div>

    </div>

  </div>

  <div id="toast" class="toast-msg">Welcome to Orchard Portal!</div>

  <script>
  // Trigger Apple Slice Animation on Click or Auto-slice after 400ms
  const appleStage = document.getElementById('apple-stage');
  const authCard = document.getElementById('auth-card');

  function triggerSlice() {
    appleStage.classList.add('sliced');
    authCard.classList.add('visible');
  }

  appleStage.addEventListener('click', triggerSlice);
  
  // Auto trigger slice on page load
  setTimeout(triggerSlice, 400);

  // Tab Switcher
  function switchAuthTab(tab) {
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');

    if (tab === 'login') {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      formLogin.style.display = 'block';
      formRegister.style.display = 'none';
    } else {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      formRegister.style.display = 'block';
      formLogin.style.display = 'none';
    }
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function fillDemoAdmin() {
    switchAuthTab('login');
    document.getElementById('login-user').value = 'admin';
    document.getElementById('login-pass').value = 'admin123';
    showToast('Demo Admin credentials populated!');
  }

  function handleLoginSubmit(e) {
    e.preventDefault();
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value.trim();

    if (user === 'admin' && pass === 'admin123') {
      localStorage.setItem('orchard_admin_logged', 'true');
      sessionStorage.setItem('orchard_admin_logged', 'true');
      showToast('Login Successful! Redirecting to Admin Dashboard...');
      setTimeout(() => {
        window.location.href = 'admin.html';
      }, 1000);
    } else {
      localStorage.setItem('orchard_user_logged', user);
      showToast('Welcome, ' + user + '! Redirecting to store...');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    }
  }

  function handleRegisterSubmit(e) {
    e.preventDefault();
    const name = document.getElementById('reg-name').value.trim();
    showToast('Account created for ' + name + '! Redirecting to store...');
    localStorage.setItem('orchard_user_logged', name);
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1200);
  }
  </script>
</body>
</html>
